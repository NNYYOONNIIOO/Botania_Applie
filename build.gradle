buildscript {
    repositories { maven { url = 'https://maven.minecraftforge.net' }; mavenCentral() }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:5.1.77' }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
version = '1.3.1-1.16.5'
group = 'nyonio'
archivesBaseName = 'botania_applie'
sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8
minecraft {
    mappings channel: 'snapshot', version: '20210309-1.16.5'
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        all {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
        }
        client {
            workingDirectory project.file(project.hasProperty('smokeTest') ? 'run-smoke-check' : 'run')
            property 'forge.logging.console.level', 'info'
            args '--mixin.config', 'botania_applie.mixins.json'
            mods {
                botania_applie { source sourceSets.main }
                if (project.hasProperty('smokeTest')) {
                    botania_applie_smoke { source sourceSets.test }
                }
            }
        }
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.console.level', 'info'
            args '--mixin.config', 'botania_applie.mixins.json', '--nogui'
            mods { botania_applie { source sourceSets.main } }
        }
        data {
            workingDirectory project.file('run-data')
            property 'forge.logging.console.level', 'info'
            args '--mixin.config', 'botania_applie.mixins.json', '--mod', 'botania_applie', '--all', '--output', file('build/smoke-data'), '--existing', file('src/main/resources')
            mods { botania_applie { source sourceSets.main } }
        }
    }
}
if (project.hasProperty('smokeTest')) {
    tasks.matching { it.name == 'runClient' }.configureEach { dependsOn tasks.named('testClasses') }
}
repositories {
    mavenCentral()
    maven { url = 'https://modmaven.dev/'; content { includeGroup 'appeng' } }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.theillusivec4.top/' }
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
    flatDir { dirs 'libs' }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.42'
    implementation fg.deobf('appeng:appliedenergistics2:8.4.7')
    implementation fg.deobf('bundled:Botania:1.16.5-420.3')
    implementation fg.deobf('bundled:terminal_interaction_integration:1.2.4-1.16.5')
    implementation fg.deobf('top.theillusivec4.curios:curios-forge:1.16.5-4.0.8.2')
    runtimeOnly fg.deobf('vazkii.patchouli:Patchouli:1.16.4-53.3')
    implementation fg.deobf("curse.maven:jade-324717:3910873")
    annotationProcessor 'org.spongepowered:mixin:0.8:processor'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-inline:3.12.4'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '500']
}
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}
jar {
    manifest {
        attributes('Specification-Title': 'botania_applie', 'Specification-Vendor': 'Nyonio',
            'Specification-Version': '1', 'Implementation-Title': project.name,
            'Implementation-Version': project.version, 'Implementation-Vendor': 'Nyonio',
            'MixinConfigs': 'botania_applie.mixins.json')
    }
    finalizedBy 'reobfJar'
}
publishing { publications { mavenJava(MavenPublication) { artifact jar } } }
